<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="reqflow 端到端业务需求 Agent 工作流">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1200" height="480" rx="18" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#5eead4" stroke-width="0.6">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200M0 420H1200"/>
    <path d="M60 0V480M120 0V480M180 0V480M240 0V480M300 0V480M360 0V480M420 0V480M480 0V480M540 0V480M600 0V480M660 0V480M720 0V480M780 0V480M840 0V480M900 0V480M960 0V480M1020 0V480M1080 0V480M1140 0V480"/>
  </g>
  <ellipse cx="600" cy="235" rx="430" ry="150" fill="url(#glow)" filter="url(#soft)"/>

  <text x="60" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" fill="#5eead4" letter-spacing="3">REQFLOW · END-TO-END REQUIREMENT AGENT</text>
  <text x="60" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="40" font-weight="700" fill="#f8fafc">从 PRD 到上线，</text>
  <text x="60" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="40" font-weight="700" fill="url(#flow)">一条能自主推进的闭环</text>
  <text x="60" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#94a3b8">上下文组织 · 三道质量门禁 · TDD 实现 · 真实环境验收 · 结项蒸馏</text>

  <g transform="translate(0,250)">
    <path d="M120 92 H1090" stroke="url(#flow)" stroke-width="3" fill="none" marker-end="url(#arrowCyan)"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" text-anchor="middle">
      <g transform="translate(140,92)"><circle r="10" fill="#0d1424" stroke="#22d3ee" stroke-width="2"/><circle r="3" fill="#22d3ee"/><text y="30" fill="#cbd5e1">进入</text></g>
      <g transform="translate(265,92)"><circle r="10" fill="#0d1424" stroke="#2dd4bf" stroke-width="2"/><circle r="3" fill="#2dd4bf"/><text y="30" fill="#cbd5e1">澄清</text></g>
      <g transform="translate(390,92)"><circle r="10" fill="#0d1424" stroke="#2dd4bf" stroke-width="2"/><circle r="3" fill="#2dd4bf"/><text y="30" fill="#cbd5e1">方案</text></g>
      <g transform="translate(570,92)"><circle r="10" fill="#0d1424" stroke="#22d3ee" stroke-width="2"/><circle r="3" fill="#22d3ee"/><text y="30" fill="#cbd5e1">实现</text></g>
      <g transform="translate(700,92)"><circle r="10" fill="#0d1424" stroke="#22d3ee" stroke-width="2"/><circle r="3" fill="#22d3ee"/><text y="30" fill="#cbd5e1">协同</text></g>
      <g transform="translate(825,92)"><circle r="10" fill="#0d1424" stroke="#22d3ee" stroke-width="2"/><circle r="3" fill="#22d3ee"/><text y="30" fill="#cbd5e1">验收</text></g>
      <g transform="translate(950,92)"><circle r="10" fill="#0d1424" stroke="#22d3ee" stroke-width="2"/><circle r="3" fill="#22d3ee"/><text y="30" fill="#cbd5e1">发布</text></g>
      <g transform="translate(1075,92)"><circle r="10" fill="#0d1424" stroke="#818cf8" stroke-width="2"/><circle r="3" fill="#818cf8"/><text y="30" fill="#cbd5e1">结项</text></g>
    </g>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" text-anchor="middle">
      <g transform="translate(328,50)"><path d="M0 18 V42" stroke="#fbbf24" stroke-opacity="0.5" stroke-dasharray="3 3"/><rect x="-18" y="-18" width="36" height="36" rx="9" fill="#1a1408" stroke="#fbbf24" stroke-width="2"/><path d="M-7 0 L-2 6 L8 -6" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text y="30" fill="#fbbf24">G1</text></g>
      <g transform="translate(480,50)"><path d="M0 18 V42" stroke="#fbbf24" stroke-opacity="0.5" stroke-dasharray="3 3"/><rect x="-18" y="-18" width="36" height="36" rx="9" fill="#1a1408" stroke="#fbbf24" stroke-width="2"/><path d="M-7 0 L-2 6 L8 -6" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text y="30" fill="#fbbf24">G2</text></g>
      <g transform="translate(640,50)"><path d="M0 18 V42" stroke="#fbbf24" stroke-opacity="0.5" stroke-dasharray="3 3"/><rect x="-18" y="-18" width="36" height="36" rx="9" fill="#1a1408" stroke="#fbbf24" stroke-width="2"/><path d="M-7 0 L-2 6 L8 -6" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text y="30" fill="#fbbf24">G3</text></g>
    </g>
    <path d="M1075 135 C1075 200 140 200 140 130" fill="none" stroke="url(#loop)" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <rect x="540" y="168" width="120" height="26" rx="13" fill="#0d1424" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="600" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">结项蒸馏 → 长期知识</text>
  </g>
</svg>
